<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="220" height="210" role="img" aria-label="Crown Dental Studio">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c9fa3"/>
      <stop offset="0.55" stop-color="#17a7b4"/>
      <stop offset="1" stop-color="#22c1cc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa3e6"/>
      <stop offset="1" stop-color="#2f6fc4"/>
    </linearGradient>
    <linearGradient id="toothOut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f95"/>
      <stop offset="1" stop-color="#136f76"/>
    </linearGradient>
    <clipPath id="discClip"><circle cx="92" cy="104" r="80"/></clipPath>
    <path id="tooth" d="M104 58 C 108 36 134 30 148 48 C 162 30 190 36 196 60 C 201 80 190 100 186 120 C 182 142 180 166 170 172 C 161 178 156 152 150 132 C 146 120 140 120 136 132 C 129 150 126 178 115 173 C 106 169 108 142 104 118 C 100 96 96 78 104 58 Z"/>
  </defs>
  <!-- blue ring and teal disc -->
  <circle cx="92" cy="104" r="88" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="92" cy="104" r="80" fill="url(#disc)"/>
  <!-- tooth outline: teal where it leaves the disc, white where it crosses it -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <use href="#tooth" stroke="url(#toothOut)"/>
    <use href="#tooth" stroke="#ffffff" clip-path="url(#discClip)"/>
  </g>
  <!-- glint on the crown -->
  <path d="M118 48 C 125 41 136 40 143 44" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
</svg>
